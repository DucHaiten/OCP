name: w100-release-portable-assets

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/w100-release-portable-assets.yml"
      - ".cargo/config.toml"
      - "projects/ocp-ocl/crates/ocl-cli/**"
      - "projects/ocp-ocl/crates/ocl-lsp/**"
      - "projects/ocp-ocl/crates/ocl-dap/**"
      - "projects/ocp-ocl/crates/ocl-sdk/**"
      - "tools/release/build_portable_archives.ps1"
      - "contracts/release/v1.0/release_asset_matrix.v1.json"
      - "contracts/release/v1.0/portable_install_contract.v1.json"

jobs:
  linux_portable:
    name: portable linux-x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Build linux-x64 binaries
        run: cargo build --release -p ocl-cli -p ocl-lsp -p ocl-dap --target x86_64-unknown-linux-musl

      - name: Package linux-x64 portable archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/ocl/w100/ci/linux-x64
          cp target/x86_64-unknown-linux-musl/release/ocl-cli target/ocl/w100/ci/linux-x64/ocl
          cp target/x86_64-unknown-linux-musl/release/ocl-lsp target/ocl/w100/ci/linux-x64/ocl-lsp
          cp target/x86_64-unknown-linux-musl/release/ocl-dap target/ocl/w100/ci/linux-x64/ocl-dap
          tar -czf target/ocl/w100/release/ocl-v1.0.0-linux-x64.tar.gz -C target/ocl/w100/ci/linux-x64 .

      - name: Upload linux-x64 portable asset
        uses: actions/upload-artifact@v4
        with:
          name: w100-portable-linux-x64
          path: target/ocl/w100/release/ocl-v1.0.0-linux-x64.tar.gz
          if-no-files-found: error

  macos_portable:
    name: portable macos-arm64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Build macos-arm64 binaries
        run: cargo build --release -p ocl-cli -p ocl-lsp -p ocl-dap --target aarch64-apple-darwin

      - name: Package macos-arm64 portable archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/ocl/w100/ci/macos-arm64
          cp target/aarch64-apple-darwin/release/ocl-cli target/ocl/w100/ci/macos-arm64/ocl
          cp target/aarch64-apple-darwin/release/ocl-lsp target/ocl/w100/ci/macos-arm64/ocl-lsp
          cp target/aarch64-apple-darwin/release/ocl-dap target/ocl/w100/ci/macos-arm64/ocl-dap
          tar -czf target/ocl/w100/release/ocl-v1.0.0-macos-arm64.tar.gz -C target/ocl/w100/ci/macos-arm64 .

      - name: Upload macos-arm64 portable asset
        uses: actions/upload-artifact@v4
        with:
          name: w100-portable-macos-arm64
          path: target/ocl/w100/release/ocl-v1.0.0-macos-arm64.tar.gz
          if-no-files-found: error

[package]
name = "ocp-sdk"
version = "0.1.0"
edition = "2021"
authors = ["DucHaiten"]
license = "AGPL-3.0-only"

[lib]
name = "ocp_sdk"
path = "src/lib.rs"

[dependencies]
ocp-runtime-core = { path = "../ocp-runtime-core" }
base64 = "0.22"
blake3 = { version = "1.5", features = ["pure"] }
ed25519-dalek = { version = "2.1", features = ["std"] }
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
